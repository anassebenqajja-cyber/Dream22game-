<title>Dream games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&family=Space+Mono:wght@400;700&display=swap">
<style id="app-css">
/* Layout: cartridge shelf. Brand bar, compact hero, search + platform filter, grid of cartridge cards. An owner-only side sheet adds games and publishes. */
:root{
  --bg:#E8EEF2;
  --surface:#F6F9FB;
  --ink:#10222B;
  --muted:#4A626D;
  --line:#C3D2DA;
  --cart:#D3DDE4;
  --cart-deep:#BCCAD3;
  --accent:#C2410C;
  --accent-ink:#FFFFFF;
  --accent2:#0B6F82;
  --pin:#B8921F;
  --danger:#B42318;
  --font-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B161C;
    --surface:#12212A;
    --ink:#E7F0F4;
    --muted:#9FB5BF;
    --line:#24404C;
    --cart:#1A2E39;
    --cart-deep:#0F1D25;
    --accent:#FF8A4C;
    --accent-ink:#1C0C03;
    --accent2:#56D3E6;
    --pin:#E2BC4F;
    --danger:#FF8F87;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B161C;
  --surface:#12212A;
  --ink:#E7F0F4;
  --muted:#9FB5BF;
  --line:#24404C;
  --cart:#1A2E39;
  --cart-deep:#0F1D25;
  --accent:#FF8A4C;
  --accent-ink:#1C0C03;
  --accent2:#56D3E6;
  --pin:#E2BC4F;
  --danger:#FF8F87;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1080px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.75rem;line-height:1;min-width:0}
.brand span{overflow-wrap:anywhere}
.logo{flex:none;height:64px;width:auto;max-width:none;display:block}
.l-body{fill:var(--accent)}
.l-label{fill:var(--bg)}
.l-pins{stroke:var(--bg);stroke-width:2;fill:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid transparent;font:inherit;font-weight:600;line-height:1.2;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{background:var(--cart-deep);color:var(--muted);cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface)}
.btn-armed{background:var(--danger);color:var(--accent-ink);border-color:var(--danger)}

.hero{margin-top:26px;padding:34px clamp(16px,4vw,40px);border-radius:18px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1.2px,transparent 1.4px);background-size:16px 16px;display:grid;gap:14px;justify-items:start}
.stat{margin:0;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.hero h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,8vw,4.4rem);line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
.lead{margin:0;max-width:52ch;color:var(--muted)}

.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px}
.search{flex:1 1 240px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:.92rem;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted)}

.notice{margin:16px 0 0;padding:10px 14px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:.9rem}
.empty{margin:28px 0;color:var(--muted);text-align:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:22px;margin-top:20px}
.cart{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--cart);padding:22px 14px 0;clip-path:polygon(0 16px,16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);transition:transform .2s ease;animation:rise .45s ease backwards;animation-delay:calc(var(--i,0) * 50ms)}
.cart:hover{transform:translateY(-4px)}
.cart::before{content:"";position:absolute;top:9px;left:50%;translate:-50% 0;width:38%;height:4px;border-radius:2px;background:var(--cart-deep)}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}

.label{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--cart-deep);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.cover{display:block;width:100%;height:100%;object-fit:cover}
.art{position:relative;width:100%;height:100%;display:grid;place-items:center}
.art b{position:relative;z-index:1;font-family:var(--font-display);font-weight:400;font-size:6rem;line-height:1;color:rgba(255,255,255,.92);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.art::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:12px 12px}
.tag{position:absolute;top:8px;inset-inline-start:8px;z-index:2;padding:3px 9px;border-radius:4px;background:rgba(8,18,24,.8);color:#fff;font-size:.74rem;font-weight:500}
.tag-sample{inset-inline-start:auto;inset-inline-end:8px;background:rgba(255,255,255,.92);color:#10222B}

.cb{display:flex;flex-direction:column;gap:8px;flex:1;padding:14px 2px 14px}
.cb h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.15;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.get{margin-top:auto;width:100%}
.pins{height:14px;margin:0 14px;background:repeating-linear-gradient(90deg,var(--pin) 0 5px,transparent 5px 10px);opacity:.9}

.toast{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:16px;pointer-events:none;z-index:50}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;max-width:100%}

dialog.sheet{position:fixed;inset:0;margin:0 auto;width:min(640px,100%);max-width:100%;height:100dvh;max-height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);border:0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(5,12,16,.62)}
.sheet-in{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.8rem}
.block{display:grid;gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.block h3{margin:0;font-size:1rem;font-weight:600}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:.9rem;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.hint{margin:0;font-size:.82rem;color:var(--muted)}
.err{margin:0;color:var(--danger);font-weight:500}
.prev{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.row + .row{margin-top:8px}
.thumb{flex:none;width:52px;height:40px;border-radius:6px;overflow:hidden;background:var(--cart-deep)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rinfo{flex:1;min-width:0;display:grid}
.rinfo b{overflow-wrap:anywhere}
.rinfo span{font-size:.8rem;color:var(--muted)}
.muted{margin:0;color:var(--muted)}
.sheet-foot{position:sticky;bottom:0;display:grid;gap:10px;margin-top:22px;padding:14px 0 16px;background:var(--surface);border-top:1px solid var(--line)}
.meter{height:8px;border-radius:99px;background:var(--cart);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent2)}
.meter.warn i{background:var(--danger)}
.foot-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.status{margin:0;min-height:1.4em;font-size:.9rem}

@media (prefers-reduced-motion: reduce){
  .cart{animation:none;transition:none}
}
</style>

function cardHTML(g,i){

  if(g.sample){btn='<button class="btn btn-primary get" type="button" disabled>نموذج للتصميم</button>'}
  else if(g.kind==='link'){btn='<a class="btn btn-primary get" href="'+esc(g.url)+'" target="_blank" rel="noopener noreferrer">فتح الرابط</a>'}
  else{btn='<button class="btn btn-primary get" type="button" data-dl="'+esc(g.id)+'">'+DL_ICON+'<span>تحميل</span></button>'}
  return '<article class="cart" style="--i:'+i+'"><div class="label">'+art+
    '<span class="tag">'+esc(PLATFORMS[g.platform]||PLATFORMS.other)+'</span>'+(g.sample?'<span class="tag tag-sample">نموذج</span>':'')+'</div>'+
    '<div class="cb"><h3>'+esc(g.title)+'</h3><p class="meta">'+meta+'</p>'+(g.desc?'<p class="desc">'+esc(g.desc)+'</p>':'')+btn+'</div>'+
    '<div class="pins"></div></article>';
}

function renderHero(){
  $('#brand-name').textContent=state.site.name||'Dream games';
  $('#tagline').textContent=state.site.tagline||'';
  $('#stat').textContent='عدد الألعاب: '+state.games.length;
  var cta=$('#hero-cta');
  cta.innerHTML='';
  if(can){
    var b=document.createElement('button');
    b.type='button';b.className='btn btn-primary';
    b.textContent=state.games.length?'إضافة لعبة جديدة':'أضف لعبتك الأولى';
    b.addEventListener('click',openAdmin);
    cta.appendChild(b);
  }
}
function renderChips(){
  var plats=[];
  list().forEach(function(g){if(plats.indexOf(g.platform)<0)plats.push(g.platform)});
  if(filter!=='all'&&plats.indexOf(filter)<0)filter='all';
  var h='<button class="chip" type="button" data-f="all" aria-pressed="'+(filter==='all')+'">الكل</button>';
  plats.forEach(function(p){h+='<button class="chip" type="button" data-f="'+esc(p)+'" aria-pressed="'+(filter===p)+'">'+esc(PLATFORMS[p]||PLATFORMS.other)+'</button>'});
  chipsEl.innerHTML=h;
  chipsEl.hidden=plats.length<2;
}
function renderGrid(){
  var items=list().filter(function(g){
    var okF=filter==='all'||g.platform===filter;
    var okQ=!query||((g.title||'')+' '+(g.desc||'')).toLowerCase().indexOf(query)>=0;
    return okF&&okQ;
  });
  gridEl.innerHTML=items.map(cardHTML).join('');
  noticeEl.hidden=!!state.games.length;
  emptyEl.hidden=!!items.length;
  if(!items.length)emptyEl.textContent=query?'لا توجد ألعاب تطابق «'+query+'».':'لا توجد ألعاب في هذا التصنيف.';
}
function renderAll(){renderHero();renderChips();renderGrid()}

var toastTimer=null;
function toast(msg){
  var t=$('#toast');t.innerHTML='<span></span>';t.firstChild.textContent=msg;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.innerHTML=''},3800);
}

/* capabilities */
var caps={};
function cap(name){
  if(!caps[name]){
    var c=window.claude;
    caps[name]=(c&&typeof c.use==='function')?Promise.resolve(c.use(name)).then(function(x){return x||null}).catch(function(){return null}):Promise.resolve(null);
  }
  return caps[name];
}

/* download */
function saveName(g){
  var n=g.fileName||'',m=/\.([A-Za-z0-9]+)$/.exec(n),ext=m?m[1].toLowerCase():'html';
  if(ext==='htm')ext='html';
  var base=(m?n.slice(0,-m[0].length):n)||g.title||'game';
  return base+'.'+ext;
}
var busy=false;
async function download(id,btn){
  if(busy)return;
  var g=null;state.games.forEach(function(x){if(x.id===id)g=x});
  if(!g)return;
  var b64=payloads[id];
  if(!b64){toast('ملف هذه اللعبة غير موجود.');return}
  busy=true;
  var label=btn.innerHTML;btn.disabled=true;btn.textContent='جارٍ التحضير…';
  try{
    var d=await cap('downloads');
    if(!d){toast('التحميل غير متاح في هذا العرض. افتح الصفحة في المتصفح.');return}
    var bin=atob(b64),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    await d.save({filename:saveName(g),data:new Blob([u8])});
    toast('تم حفظ «'+g.title+'»');
  }catch(err){
    var c=err&&err.code;
    toast(c==='declined'?'تم إلغاء الحفظ.':(c==='rate_limited'?'انتظر لحظة ثم حاول مرة أخرى.':'تعذّر حفظ الملف. حاول مرة أخرى.'));
  }finally{
    busy=false;btn.disabled=false;btn.innerHTML=label;
  }
}

gridEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-dl]');
  if(b)download(b.getAttribute('data-dl'),b);
});
chipsEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-f]');if(!b)return;
  filter=b.getAttribute('data-f');renderChips();renderGrid();
});
$('#q').addEventListener('input',function(e){query=e.target.value.trim().toLowerCase();renderGrid()});

/* admin */
function estimate(){
  var n=(($('#app-css')||{}).textContent||'').length+(($('#app-js')||{}).textContent||'').length+3000;
  n+=JSON.stringify(state).length;
  state.games.forEach(function(g){if(g.kind==='file'&&payloads[g.id])n+=payloads[g.id].length+90});
  return n;
}
function setStatus(msg,isErr){statusEl.textContent=msg||'';statusEl.style.color=isErr?'var(--danger)':'var(--muted)'}
function renderRows(){
  var rows=$('#rows');
  if(!state.games.length){rows.innerHTML='<p class="muted">لا توجد ألعاب بعد.</p>';return}
  rows.innerHTML=state.games.map(function(g){
    var th=g.cover?'<img alt="" src="'+esc(g.cover)+'">':'<div style="width:100%;height:100%;'+artBg(g.id+g.title)+'"></div>';
    var sub=[PLATFORMS[g.platform]||'',g.kind==='link'?'رابط خارجي':fmtSize(g.fileSize)].filter(Boolean).join(' · ');
    return '<div class="row"><div class="thumb">'+th+'</div><div class="rinfo"><b>'+esc(g.title)+'</b><span>'+esc(sub)+'</span></div>'+
      '<button class="btn btn-ghost" type="button" data-del="'+esc(g.id)+'">حذف</button></div>';
  }).join('');
}
function renderFoot(){
  var est=estimate(),pct=Math.min(100,est/MAX_DOC*100);
  $('#meter').firstChild.style.width=pct+'%';
  $('#meter').className='meter'+(pct>90?' warn':'');
  $('#size-line').textContent='حجم الصفحة: '+fmtSize(est);
  $('#publish').disabled=!dirty;
}
function touch(){dirty=true;renderAll();renderRows();renderFoot()}
function openAdmin(){
  $('#f-name').value=state.site.name||'';
  $('#f-tag').value=state.site.tagline||'';
  renderRows();renderFoot();
  try{sheet.showModal()}catch(e){sheet.setAttribute('open','')}
}
function closeAdmin(){try{sheet.close()}catch(e){sheet.removeAttribute('open')}}
$('#open-admin').addEventListener('click',openAdmin);
$('#close-admin').addEventListener('click',closeAdmin);

$('#f-name').addEventListener('input',function(e){state.site.name=e.target.value.trim();touch()});
$('#f-tag').addEventListener('input',function(e){state.site.tagline=e.target.value.trim();touch()});

document.querySelectorAll('[data-src]').forEach(function(b){
  b.addEventListener('click',function(){
    srcKind=b.getAttribute('data-src');
    document.querySelectorAll('[data-src]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    $('#src-file').hidden=srcKind!=='file';
    $('#src-link').hidden=srcKind!=='link';
  });
});

function readB64(file){return new Promise(function(res,rej){
  var r=new FileReader();
  r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(',')+1))};
  r.onerror=function(){rej(r.error)};
  r.readAsDataURL(file);
})}
function resizeCover(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var W=640,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
    var x=c.getContext('2d');x.fillStyle='#10222B';x.fillRect(0,0,W,H);
    var s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    URL.revokeObjectURL(url);
    res(c.toDataURL('image/jpeg',0.82));
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'))};
  img.src=url;
})}

$('#f-file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  if(f&&/\.html?$/i.test(f.name))$('#f-plat').value='web';
});
$('#f-cover').addEventListener('change',async function(e){
  var f=e.target.files&&e.target.files[0],p=$('#prev');
  if(!f){p.hidden=true;return}
  try{p.src=await resizeCover(f);p.hidden=false}catch(err){p.hidden=true}
});

function formError(msg){var el=$('#f-err');el.textContent=msg||'';el.hidden=!msg}

$('#add-form').addEventListener('submit',async function(e){
  e.preventDefault();formError('');
  var title=$('#f-title').value.trim();
  if(!title){formError('اكتب اسم اللعبة.');return}
  var g={
    id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title:title,desc:$('#f-desc').value.trim(),version:$('#f-ver').value.trim(),
    platform:$('#f-plat').value,kind:srcKind,url:'',fileName:'',fileSize:0,cover:'',added:new Date().toISOString()
  };
  var b64='';
  if(srcKind==='file'){
    var f=$('#f-file').files&&$('#f-file').files[0];
    if(!f){formError('اختر ملف اللعبة.');return}
    var m=/\.([A-Za-z0-9]+)$/.exec(f.name),ext=m?m[1].toLowerCase():'';
    if(ext!=='html'&&ext!=='htm'&&ext!=='zip'){formError('الصيغ المدعومة: HTML وZIP.');return}
    if(f.size>MAX_FILE){formError('حجم الملف أكبر من 6 MB. ارفعه على خدمة خارجية وأضف الرابط.');return}
    try{b64=await readB64(f)}catch(err){formError('تعذّرت قراءة الملف.');return}
    g.fileName=f.name.replace(/^.*[\\\/]/,'');g.fileSize=f.size;
  }else{
    var u=$('#f-url').value.trim(),ok=false;
    try{var uu=new URL(u);ok=uu.protocol==='https:'||uu.protocol==='http:'}catch(err){}
    if(!ok){formError('اكتب رابطاً صحيحاً يبدأ بـ https://');return}
    g.url=u;
  }
  var cf=$('#f-cover').files&&$('#f-cover').files[0];
  if(cf){try{g.cover=await resizeCover(cf)}catch(err){formError('تعذّرت قراءة صورة الغلاف.');return}}
  state.games.unshift(g);
  if(b64)payloads[g.id]=b64;
  if(estimate()>MAX_DOC){
    state.games.shift();delete payloads[g.id];
    formError('تجاوز الحجم الكلي 15 MB. احذف لعبة أو استخدم رابطاً خارجياً.');return;
  }
  $('#add-form').reset();$('#prev').hidden=true;
  srcKind='file';$('#src-file').hidden=false;$('#src-link').hidden=true;
  document.querySelectorAll('[data-src]').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-src')==='file'))});
  touch();
  setStatus('أُضيفت «'+g.title+'». اضغط «نشر التغييرات» لتظهر للزوار.');
});

$('#rows').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]');if(!b)return;
  if(b.getAttribute('data-armed')){
    var id=b.getAttribute('data-del');
    state.games=state.games.filter(function(g){return g.id!==id});
    delete payloads[id];
    touch();setStatus('حُذفت اللعبة. اضغط «نشر التغييرات» لتطبيق ذلك.');
    return;
  }
  b.setAttribute('data-armed','1');b.className='btn btn-armed';b.textContent='تأكيد الحذف';
  setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.className='btn btn-ghost';b.textContent='حذف'}},4000);
});

/* publish */
function buildDoc(){
  var cssEl=$('#app-css'),jsEl=$('#app-js');
  var css=cssEl?cssEl.textContent:'',js=jsEl?jsEl.textContent:'';
  if(css.indexOf('--accent')<0||js.indexOf('APP_MARK_v1')<0)throw new Error('تعذّر قراءة كود الصفحة. أعد تحميل الصفحة وحاول مرة أخرى.');
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  var pl=state.games.filter(function(g){return g.kind==='file'&&payloads[g.id]}).map(function(g){
    return S+' type="text/plain" class="payload" data-id="'+g.id+'">'+payloads[g.id]+E;
  }).join('');
  var content='<title>Dream games</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="'+FONTS+'">'+
    '<style id="app-css">'+css+'</style><div id="app" dir="rtl" lang="ar"></div>'+
    S+' type="application/json" id="site-data">'+data+E+pl+S+' id="app-js">'+js+E;
  var doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+content+'</body></html>';
  if(doc.length>MAX_DOC+400000)throw new Error('حجم الصفحة تجاوز الحد. احذف لعبة أو استخدم رابطاً خارجياً.');
  return doc;
}
$('#publish').addEventListener('click',async function(){
  var btn=this;btn.disabled=true;setStatus('جارٍ النشر…');
  var a=await cap('artifact');
  if(!a){setStatus('النشر غير متاح في هذا العرض.',true);btn.disabled=!dirty;return}
  var doc;
  try{doc=buildDoc()}catch(err){setStatus(err.message,true);btn.disabled=!dirty;return}
  try{sessionStorage.setItem('admin-open','1')}catch(err){}
  try{await a.publish(doc)}
  catch(err){
    var c=err&&err.code;
    var msg=c==='conflict'?'نُشرت نسخة أحدث من الصفحة. ستُحدَّث الصفحة الآن، وأعد إضافة التغييرات بعدها.':
      (c==='not_writer'||c==='not_granted')?'ليس لديك صلاحية تعديل هذه الصفحة.':
      c==='too_large'?'حجم الصفحة كبير جداً. احذف لعبة أو استخدم رابطاً خارجياً.':
      c==='rate_limited'?'انتظر لحظة ثم حاول مرة أخرى.':'تعذّر النشر. حاول مرة أخرى.';
    setStatus(msg,true);btn.disabled=!dirty;
  }
});

renderAll();

cap('user').then(function(u){
  if(!u)return;
  return Promise.all([u.isOwner(),u.canEdit()]).then(function(r){
    if(!(r[0]||r[1]))return;
    can=true;$('#open-admin').hidden=false;renderHero();
    var flag=null;
    try{flag=sessionStorage.getItem('admin-open');sessionStorage.removeItem('admin-open')}catch(e){}
    if(flag==='1'){openAdmin();setStatus('تم نشر التغييرات.')}
  });
}).catch(function(){});
})();
</script>
